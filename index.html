<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一週間の献立（試作）</title>
<style>
:root{
  --paper:#ffffff; --ink:#1a1917; --gray:#66625b; --hair:#cfcbc3; --shu:#c4321c;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;border-radius:0}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:16px;line-height:1.6;font-feature-settings:"palt"}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{max-width:520px;margin:0 auto;padding:20px 20px 96px}

/* 見出し */
header{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:12px;border-bottom:4px double var(--ink)}
header h1{font-family:var(--mincho);font-weight:600;font-size:32px;line-height:1.2;margin:0;letter-spacing:.08em}
header .date{font-family:var(--mincho);font-size:14px;line-height:1.4;text-align:right;color:var(--ink)}
header .date b{display:block;font-size:20px;font-weight:600}

/* 条件 */
.cond{padding:16px 0 4px}
.crow{display:flex;align-items:stretch;margin-bottom:8px}
.clabel{flex:none;width:44px;font-size:12px;color:var(--gray);display:flex;align-items:center;letter-spacing:.1em}
.opts{flex:1;display:flex;border:1px solid var(--ink)}
.opt{flex:1;min-height:42px;font-size:13px;border-left:1px solid var(--ink);background:var(--paper);white-space:nowrap;padding:0 2px}
.opt:first-child{border-left:0}
.opt.on{background:var(--ink);color:var(--paper);font-weight:600}

/* 献立の案 */
.plan{display:flex;gap:14px;padding:20px 0 22px;border-top:1px solid var(--ink)}
.plan:first-of-type{border-top:0;margin-top:6px}
.num{flex:none;width:30px;font-family:var(--mincho);font-size:24px;font-weight:600;color:var(--shu);line-height:1.3;text-align:center}
.pbody{flex:1;min-width:0}
.ptop{display:flex;justify-content:space-between;font-size:13px;color:var(--gray);margin-bottom:2px}
.ptop .t{color:var(--ink);font-weight:600}
.plan h2{font-family:var(--mincho);font-weight:600;font-size:23px;line-height:1.4;margin:0 0 8px;letter-spacing:0;text-wrap:balance}
.sub{margin:0 0 12px;display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:2px;align-items:baseline}
.sub dt{font-size:11px;color:var(--gray);letter-spacing:.15em}
.sub dd{margin:0;font-family:var(--mincho);font-size:18px}
.buy{margin:0 0 14px;font-size:14px;display:flex;gap:10px;align-items:baseline;line-height:1.5}
.buy .lab{flex:none;font-size:12px;font-weight:600;padding:1px 7px;background:var(--shu);color:#fff;letter-spacing:.05em}
.buy.none .lab{background:var(--paper);color:var(--ink);border:1px solid var(--ink)}
.buy.none{color:var(--gray)}
.actions{display:flex;gap:8px}
.go{flex:1.3;min-height:50px;background:var(--ink);color:var(--paper);font-weight:600;font-size:16px;letter-spacing:.1em}
.more{flex:1;min-height:50px;border:1px solid var(--ink);font-size:14px}
.empty{padding:36px 8px;text-align:center;color:var(--gray);border-bottom:1px solid var(--ink)}
.again{width:100%;min-height:54px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);font-family:var(--mincho);font-size:17px;font-weight:600;letter-spacing:.15em}

/* 材料と作り方 */
.detail{margin-top:18px}
.detail h3{font-family:var(--mincho);font-size:17px;font-weight:600;margin:18px 0 6px;padding:5px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;align-items:baseline}
.detail h3 small{font-family:var(--gothic);font-weight:400;font-size:12px;color:var(--gray)}
.ings{list-style:none;margin:0;padding:0}
.ings li{display:flex;gap:8px;font-size:14px;padding:5px 0;border-bottom:1px dotted var(--hair);align-items:baseline}
.ings .n{flex:1}
.ings .q{color:var(--gray);text-align:right}
.ings .st{flex:none;width:34px;font-size:11px;color:var(--gray);text-align:right}
.ings li.miss .n{font-weight:600}
.ings li.miss .st{color:var(--shu);font-weight:600}
ol.steps{margin:10px 0 0;padding:0;list-style:none;counter-reset:s;font-size:14px;line-height:1.7}
ol.steps li{counter-increment:s;display:flex;gap:10px;margin-bottom:6px}
ol.steps li::before{content:counter(s,cjk-ideographic);flex:none;width:18px;font-family:var(--mincho);font-weight:600;color:var(--shu)}

/* 冷蔵庫 */
.lead{font-size:13px;color:var(--gray);margin:14px 0 10px;line-height:1.7}
.legend{display:flex;gap:16px;font-size:12px;margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:14px;border:1px solid var(--ink);margin-right:5px;vertical-align:-2px}
.legend .h i{background:var(--ink)}
.legend .u i{background:var(--shu);border-color:var(--shu)}
.cat h2,details.cat summary{font-family:var(--mincho);font-size:18px;font-weight:600;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline;letter-spacing:.08em}
.cat h2 small,details.cat summary small{font-family:var(--gothic);font-weight:400;font-size:12px;color:var(--gray);letter-spacing:0}
details.cat summary{cursor:pointer;list-style:none;border-top:1px solid var(--ink);padding-top:14px}
details.cat summary::-webkit-details-marker{display:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);border-left:1px solid var(--ink)}
.item{min-height:50px;padding:4px;font-size:14px;line-height:1.3;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);background:var(--paper);color:var(--ink)}
.item.have{background:var(--ink);color:var(--paper);font-weight:600}
.item.have,.item.urgent{box-shadow:inset 0 0 0 2px var(--paper)}
.item.urgent{background:var(--shu);color:#fff;font-weight:600}
.item.urgent::after{content:"早く使う";display:block;font-size:10px;font-weight:400;letter-spacing:.1em}

/* 下の切り替え */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;min-height:58px;font-family:var(--mincho);font-size:15px;letter-spacing:.1em;border-top:4px solid transparent;margin-top:-1px;line-height:1.3}
nav button small{display:block;font-family:var(--gothic);font-size:10px;letter-spacing:0}
nav button.on{border-top-color:var(--shu);font-weight:600}
nav button:disabled{color:#a9a59d}

/* 決定の画面 */
.sheet{position:fixed;inset:0;background:rgba(26,25,23,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet .box{background:var(--paper);width:100%;max-width:520px;border-top:4px solid var(--shu);padding:24px 20px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.sheet .k{font-size:12px;color:var(--gray);letter-spacing:.15em;margin-bottom:4px}
.sheet h2{font-family:var(--mincho);font-size:24px;font-weight:600;margin:0 0 10px;letter-spacing:.06em}
.sheet ul{list-style:none;margin:0 0 16px;padding:0;border-top:1px solid var(--ink)}
.sheet ul li{padding:8px 0;border-bottom:1px dotted var(--hair);font-family:var(--mincho);font-size:17px}
.sheet .note{font-size:12px;color:var(--gray);margin:0 0 16px}
.sheet .go{width:100%}

/* 週の献立 */
.wide{display:block;width:100%;min-height:54px;margin:18px 0 0}
.days{border-top:1px solid var(--ink);margin-top:14px}
.day{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--hair)}
.day:last-child{border-bottom:1px solid var(--ink)}
.dd{flex:none;width:40px;text-align:center;font-family:var(--mincho)}
.dd b{display:block;font-size:22px;line-height:1.2;font-weight:600}
.dd span{display:block;font-size:11px;color:var(--gray);font-family:var(--gothic)}
.dd i{display:block;font-style:normal;font-family:var(--gothic);font-size:10px;background:var(--shu);color:#fff;margin-top:3px;letter-spacing:.1em}
.day.today .dd b{color:var(--shu)}
.day.past .dd,.day.past .dbody{opacity:.45}
.day.past.logged .dd,.day.past.logged .dbody{opacity:.75}
.sheet .lname{display:flex;gap:8px;margin:0 0 4px}
.sheet .lname input{flex:1;min-width:0;min-height:48px;border:1px solid var(--ink);padding:0 10px;font-size:16px;font-family:inherit;background:var(--paper);color:var(--ink);border-radius:0}
.sheet .lname button{flex:none;min-height:48px;padding:0 14px;background:var(--ink);color:var(--paper);font-size:14px}
.sheet .moved{border-top:1px solid var(--ink);margin-top:16px;padding-top:12px}
.sheet .moved p{margin:0 0 8px;font-size:14px;line-height:1.6}
.dbody{flex:1;min-width:0;text-align:left;min-height:48px}
.dbody:disabled{color:inherit}
.day h2{font-family:var(--mincho);font-size:17px;text-wrap:balance;font-weight:600;line-height:1.4;margin:0}
.subline{margin:2px 0 0;font-size:12px;color:var(--gray);line-height:1.5}
.mk{display:inline-block;border:1px solid var(--ink);color:var(--ink);font-size:10px;padding:0 4px;margin-right:6px}
.offday{margin:0;color:var(--gray);font-size:15px}
.chg{flex:none;min-width:56px;min-height:44px;border:1px solid var(--ink);font-size:13px}
.again{margin-top:10px;border-top:0}
.plan .pbody .actions .more{font-size:13px}
/* 買い物 */
.left{float:right;color:var(--shu);font-size:14px}
.buyrow{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;border-bottom:1px dotted var(--hair);text-align:left}
.buyrow .bx{flex:none;width:22px;height:22px;border:1.5px solid var(--ink)}
.buyrow .n{flex:1;font-size:16px;font-weight:600}
.buyrow .q{font-size:14px;text-align:right}
.buyrow .w{flex:none;width:58px;font-size:11px;color:var(--gray);text-align:right}
.buyrow.done .bx{background:var(--ink);box-shadow:inset 0 0 0 3px var(--paper)}
.buyrow.done .n,.buyrow.done .q{text-decoration:line-through;color:var(--gray);font-weight:400}
.cat h2{border-bottom:1px solid var(--ink);padding-bottom:4px}
.cat .grid{margin-top:-9px}
/* 変える画面 */
.rows{border-top:1px solid var(--ink)}
.srow{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:54px;text-align:left;border-bottom:1px solid var(--hair);font-size:16px}
.srow small{font-size:11px;color:var(--gray)}

/* 在庫帳 */
.search{margin-top:16px}
.search input{width:100%;height:50px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);font:inherit;font-size:16px;padding:0 12px;-webkit-appearance:none;appearance:none;outline-offset:2px}
details.cat .rows{border-top:1px solid var(--ink)}
.frow{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;border-bottom:1px dotted var(--hair);text-align:left}
.frow .n{flex:1;font-size:16px}
.frow .fs{flex:none;font-size:12px}
.frow .fs.low{background:var(--shu);color:#fff;padding:1px 7px;font-weight:600}
.frow .fs.none{color:var(--gray)}
.frow .w{flex:none;width:38px;text-align:right;font-size:11px;color:var(--gray)}
details.cat .wide{margin:10px 0 0;min-height:46px}
.sheet .grid{margin-top:4px}
</style>
</head>
<body>
<div id="app"></div>
<nav><div class="in">
  <button data-tab="week">今週</button>
  <button data-tab="today">きょう</button>
  <button data-tab="shop">買い物</button>
  <button data-tab="fridge">冷蔵庫</button>
</div></nav>
<div id="sheet"></div>

<script>
// ===== 食材（名前・分類・常備品か） =====
const CATS=['野菜','肉・魚','卵・豆腐','乾物・缶詰','調味料'];
const ING={
 daikon:['大根','野菜'],ninjin:['にんじん','野菜'],tamanegi:['玉ねぎ','野菜'],negi:['長ねぎ','野菜'],
 kyabetsu:['キャベツ','野菜'],hakusai:['白菜','野菜'],horenso:['ほうれん草','野菜'],komatsuna:['小松菜','野菜'],
 nasu:['なす','野菜'],kyuri:['きゅうり','野菜'],piman:['ピーマン','野菜'],moyashi:['もやし','野菜'],
 kabocha:['かぼちゃ','野菜'],jagaimo:['じゃがいも','野菜'],shimeji:['しめじ','野菜'],shoga:['しょうが','野菜'],
 sake:['生鮭','肉・魚'],saba:['さば','肉・魚'],buri:['ぶり','肉・魚'],torimomo:['鶏もも肉','肉・魚'],
 torimune:['鶏むね肉','肉・魚'],butakoma:['豚こま肉','肉・魚'],butabara:['豚バラ薄切り','肉・魚'],hikiniku:['鶏ひき肉','肉・魚'],
 tamago:['卵','卵・豆腐'],tofu:['豆腐','卵・豆腐'],aburaage:['油揚げ','卵・豆腐'],atsuage:['厚揚げ','卵・豆腐'],natto:['納豆','卵・豆腐'],
 wakame:['乾燥わかめ','乾物・缶詰'],katsuo:['かつお節','乾物・缶詰'],goma:['ごま','乾物・缶詰'],tsuna:['ツナ缶','乾物・缶詰'],
 shoyu:['しょうゆ','調味料',1],miso:['みそ','調味料',1],mirin:['みりん','調味料',1],ryorishu:['料理酒','調味料',1],
 sato:['砂糖','調味料',1],shio:['塩','調味料',1],su:['酢','調味料',1],dashi:['顆粒だし','調味料',1],
 gomaabura:['ごま油','調味料',1],abura:['サラダ油','調味料',1],katakuriko:['片栗粉','調味料',1]
};
// ===== レシピ（2人分）。試作用の少数。手順は自作の文 =====
const R=[
 {id:'m1',type:'主菜',name:'鮭の塩焼き',emo:'🐟',time:12,main:'魚',tired:1,
  ing:[['sake','2切れ'],['shio','少々'],['daikon','5cm（おろし用・なくても可）',1]],
  steps:['鮭の両面に塩をふり、5分おいて出た水気をふき取る。','魚焼きグリルの中火で7〜8分、焼き色がつくまで焼く。','大根があればすりおろして添える。']},
 {id:'m2',type:'主菜',name:'さばの味噌煮',emo:'🐟',time:15,main:'魚',
  ing:[['saba','2切れ'],['shoga','1かけ'],['miso','大さじ2'],['sato','大さじ1'],['mirin','大さじ1'],['ryorishu','大さじ2']],
  steps:['さばの皮に切り目を入れる。しょうがは薄切りにする。','フライパンに水150ml・料理酒・砂糖・みりん・しょうがを入れて煮立てる。','さばを皮を上にして入れ、ふたをして中火で5分煮る。','みそを煮汁で溶いて加え、煮汁をかけながら4〜5分煮つめる。']},
 {id:'m3',type:'主菜',name:'ぶりの照り焼き',emo:'🐟',time:12,main:'魚',
  ing:[['buri','2切れ'],['shoyu','大さじ1と1/2'],['mirin','大さじ1と1/2'],['ryorishu','大さじ1'],['abura','小さじ1']],
  steps:['ぶりの水気をふき取る。','フライパンに油を熱し、中火で両面を3分ずつ焼く。','出た脂をふき取り、しょうゆ・みりん・料理酒を加えて、からめながら1〜2分煮つめる。']},
 {id:'m4',type:'主菜',name:'鶏の照り焼き',emo:'🍗',time:15,main:'肉',
  ing:[['torimomo','1枚'],['shoyu','大さじ1と1/2'],['mirin','大さじ1と1/2'],['ryorishu','大さじ1']],
  steps:['鶏肉は厚い所に切り目を入れて開く。','フライパンに皮を下にして入れ、中火で5分、こんがり焼く。','裏返してふたをし、弱めの中火で4分蒸し焼きにする。','脂をふき取り、調味料を加えてからめる。食べやすく切る。']},
 {id:'m5',type:'主菜',name:'豚のしょうが焼き',emo:'🥩',time:10,main:'肉',
  ing:[['butakoma','200g'],['tamanegi','1/2個'],['shoga','1かけ'],['shoyu','大さじ1と1/2'],['mirin','大さじ1'],['ryorishu','大さじ1'],['abura','小さじ1']],
  steps:['玉ねぎは薄切り、しょうがはすりおろす。','フライパンに油を熱し、玉ねぎと豚肉を中火で炒める。','肉の色が変わったら、しょうがと調味料を加えて全体にからめる。']},
 {id:'m6',type:'主菜',name:'豚バラと白菜のレンジ蒸し',emo:'🥬',time:10,main:'肉',tired:1,
  ing:[['butabara','150g'],['hakusai','1/8個'],['ryorishu','大さじ1'],['shoyu','大さじ1'],['su','大さじ1']],
  steps:['白菜はざく切り、豚肉は5cm幅に切る。','耐熱皿に白菜と豚肉を交互に重ね、料理酒をふる。','ふんわりラップをして600Wで6分。肉に赤い所が残っていれば1分ずつ追加する。','しょうゆと酢を合わせたたれをかける。']},
 {id:'m7',type:'主菜',name:'鶏むねのねぎ塩レンジ蒸し',emo:'🍗',time:10,main:'肉',tired:1,
  ing:[['torimune','1枚'],['negi','1/2本'],['ryorishu','大さじ1'],['shio','小さじ1/3'],['gomaabura','小さじ2']],
  steps:['鶏肉はフォークで全体を刺し、耐熱皿にのせて料理酒をふる。','ふんわりラップをして600Wで3分、裏返してさらに2分。そのまま3分おいて余熱で火を通す。','長ねぎをみじん切りにし、塩・ごま油と混ぜる。','鶏肉を薄く切り（中まで白くなっているか確認）、ねぎ塩だれをかける。']},
 {id:'m8',type:'主菜',name:'肉豆腐',emo:'🍲',time:15,main:'肉',
  ing:[['butakoma','150g'],['tofu','1丁'],['negi','1本'],['shoyu','大さじ2'],['mirin','大さじ2'],['sato','大さじ1/2'],['dashi','小さじ1/2']],
  steps:['豆腐は6等分、長ねぎは斜め切りにする。','鍋に水200mlと調味料を入れて煮立て、豚肉をほぐし入れる。','あくを取り、豆腐と長ねぎを加えて中火で7〜8分煮る。']},
 {id:'m9',type:'主菜',name:'厚揚げと小松菜の煮びたし',emo:'🥬',time:10,main:'豆腐・卵',tired:1,
  ing:[['atsuage','1枚'],['komatsuna','1/2束'],['dashi','小さじ1/2'],['shoyu','大さじ1'],['mirin','大さじ1']],
  steps:['厚揚げは一口大、小松菜は4cmに切る。','鍋に水150mlと調味料を入れて煮立て、厚揚げを入れて3分煮る。','小松菜を加え、しんなりするまで2分煮る。']},
 {id:'m10',type:'主菜',name:'豆腐の鶏そぼろあん',emo:'🍲',time:15,main:'豆腐・卵',
  ing:[['tofu','1丁'],['hikiniku','100g'],['shoga','1かけ'],['shoyu','大さじ1と1/2'],['mirin','大さじ1'],['dashi','小さじ1/2'],['katakuriko','小さじ2']],
  steps:['豆腐は4等分にする。しょうがはすりおろす。','鍋にひき肉と調味料・水150mlを入れ、混ぜてから火にかける。','煮立ったら豆腐を入れて5分煮る。','片栗粉を同量の水で溶いて回し入れ、とろみをつけてしょうがをのせる。']},
 {id:'m11',type:'主菜',name:'なすとピーマンの味噌炒め',emo:'🍆',time:12,main:'野菜',

const WD='日月火水木金土';
const PERISH=['moyashi','horenso','komatsuna'];   // 冷凍しにくい物だけ、週の前半に寄せる（肉・魚は冷凍する前提で寄せない）
const have=id=>!!S.stock[id];
const need=r=>r.ing.filter(i=>!i[2]).map(i=>i[0]);
const fresh=r=>need(r).filter(id=>!ING[id][2]);
function total(m,s,p){return m.time+Math.ceil((s.time+p.time)/2);}
function key(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function todayIdx(){return (new Date().getDay()-S.shop+7)%7;}
function weekStart(off){const s=new Date();s.setHours(0,0,0,0);s.setDate(s.getDate()-todayIdx()+off*7);return s;}
function dayDate(off,i){const s=weekStart(off);s.setDate(s.getDate()+i);return s;}
function wk(off){return S.weeks[key(weekStart(off))];}
function combo(day){return day&&day.c?day.c.map(id=>BY[id]):null;}
function firstDay(off){return off===0?todayIdx():0;}

function pickDay(days,i,mode,avoid){
  const usedM={},usedS={},usedP={},bought=new Set();
  days.forEach((d,j)=>{
    const c=combo(d);if(j===i||!c)return;
    usedM[c[0].id]=1;usedS[c[1].id]=(usedS[c[1].id]||0)+1;usedP[c[2].id]=(usedP[c[2].id]||0)+1;
    c.forEach(r=>fresh(r).forEach(x=>bought.add(x)));
  });
  const near=[combo(days[i-1]),combo(days[i+1])];
  const tired=mode==='tired',limit=tired?17:25;
  const mains=R.filter(r=>r.type==='主菜'&&(!tired||r.tired));
  const sides=R.filter(r=>r.type==='副菜'&&(!tired||r.time<=5));
  const soups=R.filter(r=>r.type==='汁物'&&(!tired||r.time<=6));
  let best=null;const rec=recentMains();
  for(const m of mains){const fm=fresh(m);
    for(const s of sides){const fs=fresh(s);if(fs.some(x=>fm.includes(x)))continue;
      for(const p of soups){const fp=fresh(p);if(fp.some(x=>fm.includes(x)||fs.includes(x)))continue;
        if(total(m,s,p)>limit)continue;
        const ids=[...fm,...fs,...fp];
        // 家にある物と、同じ週にすでに買う物を使う献立ほど点が高い（使い切り）
        let sc=ids.filter(x=>have(x)||bought.has(x)).length/ids.length*60+Math.random()*40;
        if(usedM[m.id])sc-=300;
        if(rec[m.id])sc-=60;   // 最近10日に作った主菜は避ける
        if(avoid===m.id)sc-=500;
        near.forEach(n=>{if(!n)return;if(n[0].main===m.main)sc-=45;if(n[1].id===s.id)sc-=40;if(n[2].id===p.id)sc-=40;});
        sc-=(usedS[s.id]||0)*25+(usedP[p.id]||0)*18;
        if(ids.some(x=>PERISH.includes(x)))sc-=i*6;
        if(!best||sc>best.sc)best={sc,c:[m.id,s.id,p.id]};
      }}}
  return best?best.c:null;
}
function makeWeek(off){
  const k=key(weekStart(off)),old=S.weeks[k],from=firstDay(off),days=[];
  for(let i=0;i<7;i++){
    const o=old&&old[i];
    if(i<from)days.push(o||{c:null,mode:'past'});
    else days.push({c:null,mode:o&&o.mode!=='past'?o.mode:'cook'});
  }
  for(let i=from;i<7;i++)if(days[i].mode!=='skip')days[i].c=pickDay(days,i,days[i].mode);
  S.weeks[k]=days;delete S.bought[k];
}
function missOf(c){return [...new Set(c.flatMap(need))].filter(id=>!have(id));}

// 買い物：1週間分を食材ごとに足し合わせる
const FR=[[1/8,'1/8'],[1/4,'1/4'],[1/3,'1/3'],[3/8,'3/8'],[1/2,'1/2'],[5/8,'5/8'],[2/3,'2/3'],[3/4,'3/4'],[7/8,'7/8']];
function fmt(n,u){
  if(u==='g'||u==='cm')return Math.round(n)+u;
  let w=Math.floor(n+0.02),f=n-w,t='';
  if(f>0.02){const hit=FR.find(x=>Math.abs(x[0]-f)<0.03);if(hit)t=hit[1];else{w+=1;}}
  return (w?w+(t?'と'+t:''):t)+u;
}
function lastDay(off){const sp=S.span||0;return sp?Math.min(6,firstDay(off)+sp-1):6;}
function shopList(off){
  const days=wk(off);if(!days)return null;
  const from=firstDay(off),map={};
  days.forEach((d,i)=>{
    const c=combo(d);if(i<from||i>lastDay(off)||!c)return;
    const wd=WD[(S.shop+i)%7];
    c.forEach(r=>r.ing.forEach(([id,q,o])=>{
      if(o)return;
      const e=map[id]||(map[id]={id,u:{},days:[]});
      const m=q.match(/^(\d+)(?:\/(\d+))?([^\d（]+)/);
      if(m)e.u[m[3]]=(e.u[m[3]]||0)+(m[2]?m[1]/m[2]:+m[1]);
      if(!e.days.includes(wd))e.days.push(wd);
    }));
  });
  const b=S.bought[key(weekStart(off))]||{};
  return Object.values(map).filter(e=>!have(e.id)||b[e.id]).map(e=>({...e,done:!!b[e.id],
    qty:Object.keys(e.u).map(u=>fmt(e.u[u],u)).join('＋')}));
}

}
function fridgeAct(a,v,v2){
  const now=Date.now();
  if(a==='tog'){S.openP[v]=!S.openP[v];}
  else if(a==='item'){showItem(v);return false;}
  else if(a==='addp'){showAdd(v);return false;}
  else if(a==='st'){
    if(v2==='none'){delete S.stock[v];delete S.low[v];delete S.place[v];S.out[v]=true;}
    else if(v2==='drop'){delete S.out[v];}
    else{delete S.out[v];S.stock[v]=true;S.seen[v]=now;if(v2==='low')S.low[v]=true;else delete S.low[v];}
    $('#sheet').innerHTML='';
  }
  else if(a==='frz'){
    if(place(v)==='冷凍庫')delete S.place[v];else S.place[v]='冷凍庫';
    delete S.out[v];S.stock[v]=true;S.seen[v]=now;$('#sheet').innerHTML='';
  }
  else if(a==='add'){
    if(have(v)&&place(v)===v2){delete S.stock[v];delete S.low[v];delete S.place[v];}
    else{delete S.out[v];S.stock[v]=true;S.seen[v]=now;if(v2==='冷凍庫')S.place[v]='冷凍庫';else delete S.place[v];}
    S.openP[v2]=true;showAdd(v2);
  }
  else if(a==='newc'){
    const name=(S.q||'').trim();if(!name)return false;
    const id='c'+now;ING[id]=[name,'その他'];S.custom.push({id,name});
    S.stock[id]=true;S.seen[id]=now;S.q='';S.openP['冷蔵室']=true;
  }
  else return null;
  return true;
}
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;fillList();}});

// ===== 表示 =====
const $=s=>document.querySelector(s);
const app=$('#app');
function opt(label,on,act){return `<button class="opt${on?' on':''}" data-act="${act}">${label}</button>`;}
function head(title,right){return `<header><h1>${title}</h1><div class="date">${right}</div></header>`;}
function md(d){return `${d.getMonth()+1}月${d.getDate()}日`;}
function weekSwitch(){return `<div class="crow"><span class="clabel">表示</span><div class="opts">${opt('今週',S.off===0,'off:0')}${opt('来週',S.off===1,'off:1')}</div></div>`;}
function buyLine(miss){
  return miss.length
   ?`<p class="buy"><span class="lab">買い足し</span><span>${miss.map(id=>ING[id][0]).join('、')}</span></p>`
   :`<p class="buy none"><span class="lab">買い物なし</span><span>家にある物で作れます</span></p>`;
}
// ===== 食べた物の記録 =====
const LOGK={plan:'献立どおり作った',other:'別の物を作った',out:'外食・お惣菜'};
function logOf(off,i){return (S.log||{})[key(dayDate(off,i))];}
function recentMains(){
  const t=Date.now(),r={};
  Object.entries(S.log||{}).forEach(([k,v])=>{const [y,m,d]=k.split('-');if(v.k==='plan'&&v.c&&t-new Date(y,m-1,d)<10*864e5)r[v.c[0]]=1;});
  return r;
}
function laterDays(i){const days=wk(0);return days.map((x,j)=>j).filter(j=>j>i&&j>=todayIdx()&&days[j].mode!=='skip'&&days[j].c);}
function showLog(i){
  const days=wk(0),d=days[i],dt=dayDate(0,i),L=logOf(0,i),c=combo(d),later=laterDays(i);
  let h=`<div class="sheet" data-act="close"><div class="box">
   <div class="k">${md(dt)}・${WD[dt.getDay()]}曜日${L?'・いまの記録は「'+LOGK[L.k]+'」':''}</div>
   <h2>食べた物を記録する</h2><div class="rows">`;
  if(c)h+=`<button class="srow" data-act="log:${i}:plan">献立どおり作った<small>${c[0].name}・${c[1].name}・${c[2].name}</small></button>`;
  h+=`<button class="srow" data-act="log:${i}:out">外食・お惣菜</button></div>
   <div class="k" style="margin-top:16px">別の物を作った</div>
   <div class="lname"><input id="lname" type="text" maxlength="30" placeholder="料理の名前（例：カレー）" value="${L&&L.k==='other'?esc(L.name):''}" autocomplete="off"><button data-act="log:${i}:other">記録する</button></div>`;
  if(L&&L.k!=='plan'&&c&&!d.moved&&later.length){
    const last=combo(days[later[later.length-1]]);
    h+=`<div class="moved"><p>予定していた「${c[0].name}」は、まだ作っていません。買った材料を使うなら、先の日へ回せます。</p>
     <button class="srow" data-act="shift:${i}">残りの献立を1日ずつ後ろへずらす<small>${WD[dayDate(0,later[later.length-1]).getDay()]}曜の「${last[0].name}」は献立から外れます</small></button></div>`;
  }
  if(d.moved)h+=`<p class="note" style="margin-top:12px">この日の献立は、後ろの日へずらしました。</p>`;
  if(L)h+=`<div class="rows" style="margin-top:16px"><button class="srow" data-act="log:${i}:del">記録を消す</button></div>`;
  $('#sheet').innerHTML=h+`<button class="go wide" data-act="close">とじる</button></div></div>`;
}
function logAct(a,v,v2){
  const i=+v,days=wk(0);
  if(a==='logs'){showLog(i);return false;}
  if(a==='log'){
    const k=key(dayDate(0,i)),d=days[i];
    if(v2==='del'){delete S.log[k];$('#sheet').innerHTML='';return true;}
    if(v2==='other'){
      const n=($('#lname').value||'').trim();
      if(!n){$('#lname').focus();$('#lname').placeholder='料理の名前を入れてください';return false;}
      S.log[k]={k:'other',name:n};
    }else S.log[k]={k:v2,c:v2==='plan'&&d.c?d.c.slice():null};
    save();render();
    if(v2==='plan'||!d.c||d.moved||!laterDays(i).length)$('#sheet').innerHTML='';else showLog(i);
    return false;
  }
  if(a==='shift'){
    const d=days[i],later=laterDays(i);
    let carry=d.c;later.forEach(j=>{const t=days[j].c;days[j].c=carry;carry=t;});
    d.moved=true;$('#sheet').innerHTML='';return true;
  }
  return null;
}
function renderWeek(){
  const off=S.off,days=wk(off),a=dayDate(off,0),b=dayDate(off,6),ti=off===0?todayIdx():-1;
  let h=head(off?'来週の献立':'今週の献立',`<b>${md(a)}</b>〜${md(b)}`);
  h+=`<section class="cond">${weekSwitch()}
   <div class="crow"><span class="clabel">始まり</span><div class="opts">${[...WD].map((w,i)=>opt(w,S.shop===i,'shop:'+i)).join('')}</div></div>
   <p class="lead" style="margin:6px 0 0">一週間を数え始める曜日です。買い物はいつ行っても構いません。</p></section>`;
  if(!days){
    h+=`<div class="empty">まだ献立がありません。</div><button class="go wide" data-act="make">一週間の献立を作る</button>`;
    app.innerHTML=h;return;
  }
  h+='<div class="days">';
  days.forEach((d,i)=>{
    const dt=dayDate(off,i),c=combo(d),past=i<ti,L=off===0&&i<=ti?logOf(0,i):null;
    let body;
    if(L&&L.k==='plan'&&c)body=`<h2>${c[0].name}</h2><p class="subline"><span class="mk">作った</span>${c[1].name}・${c[2].name}</p>`;
    else if(L&&L.k==='other')body=`<h2>${esc(L.name)}</h2><p class="subline"><span class="mk">別の物</span>${c?'献立は'+c[0].name:''}${d.moved?'（後ろへずらした）':''}</p>`;
    else if(L&&L.k==='out')body=`<h2>外食・お惣菜</h2><p class="subline"><span class="mk">記録</span>${c?'献立は'+c[0].name:''}${d.moved?'（後ろへずらした）':''}</p>`;
    else if(c)body=`<h2>${c[0].name}</h2><p class="subline">${d.mode==='tired'?'<span class="mk">疲れた日</span>':''}${c[1].name}・${c[2].name}</p>`;
    else if(d.mode==='skip')body=`<p class="offday">作らない日</p>`;
    else body=`<p class="offday">—</p>`;
    h+=`<article class="day${i===ti?' today':''}${past?' past':''}${L?' logged':''}">
      <div class="dd"><b>${WD[dt.getDay()]}</b><span>${dt.getDate()}日</span>${i===ti?'<i>今日</i>':''}</div>
      <button class="dbody" ${c&&!past?`data-act="view:${i}"`:'disabled'}>${body}</button>
      ${past?(off===0?`<button class="chg" data-act="logs:${i}">${L?'記録済':'記録'}</button>`:''):`<button class="chg" data-act="day:${i}">変える</button>`}
    </article>`;
  });
  h+=`</div><button class="go wide" data-act="go:shop">買い物リストを見る</button>
   <button class="again" data-act="make">一週間を作り直す</button>`;
  app.innerHTML=h;
}
function detail(c){
  let h='<div class="detail">';
  c.forEach(x=>{
    h+=`<h3><span>${x.name}</span><small>${x.time}分・2人分</small></h3><ul class="ings">`;
    x.ing.forEach(([id,q,o])=>{
      const ok=have(id);
      h+=`<li class="${ok||o?'':'miss'}"><span class="n">${ING[id][0]}</span><span class="q">${q}</span><span class="st">${ok?'ある':(o?'':'買う')}</span></li>`;
    });
    h+=`</ul><ol class="steps">${x.steps.map(s=>`<li><span>${s}</span></li>`).join('')}</ol>`;
  });
  return h+'</div>';
}
function renderToday(){
  const sel=S.sel||{off:0,i:todayIdx()},days=wk(sel.off),dt=dayDate(sel.off,sel.i);
  const isToday=sel.off===0&&sel.i===todayIdx();
  let h=head(isToday?'今日の献立':WD[dt.getDay()]+'曜の献立',`<b>${md(dt)}</b>${WD[dt.getDay()]}曜日`);
  if(!days){
    h+=`<div class="empty">今週の献立がまだありません。<br>先に一週間分を作ると、ここに今日の分が出ます。</div><button class="go wide" data-act="make">一週間の献立を作る</button>`;
    app.innerHTML=h;return;
  }
  const d=days[sel.i],c=combo(d),i=sel.i;
  if(!c){
    h+=`<div class="empty">${d.mode==='skip'?'今日は作らない日です。':'この日の献立はありません。'}</div>
     <button class="go wide" data-act="${d.mode==='skip'?'skip':'re'}:${i}">献立を入れる</button>`;
    app.innerHTML=h;return;
  }
  h+=`<article class="plan"><div class="pbody">
    <div class="ptop"><span>${d.mode==='tired'?'疲れた日の献立':'主菜'}</span><span class="t">約${total(...c)}分</span></div>
    <h2>${c[0].name}</h2>
    <dl class="sub"><dt>副菜</dt><dd>${c[1].name}</dd><dt>汁物</dt><dd>${c[2].name}</dd></dl>
    ${buyLine(missOf(c))}
    ${sel.off===0&&i<=todayIdx()?`<button class="more wide" style="margin:0 0 12px" data-act="logs:${i}">${logOf(0,i)?'記録済：'+LOGK[logOf(0,i).k]:'食べた物を記録する'}</button>`:''}
    <div class="actions"><button class="more" data-act="re:${i}">別の献立に変える</button><button class="more" data-act="tired:${i}">${d.mode==='tired'?'ふつうの献立に戻す':'疲れた日の献立に'}</button></div>
    ${detail(c)}
   </div></article>`;
  app.innerHTML=h;
}
function shopText(off){
  const list=shopList(off)||[],bk=S.bought[key(weekStart(off))]||{},a=dayDate(off,firstDay(off)),b=dayDate(off,lastDay(off));
  const inl=new Set(list.map(e=>e.id)),lows=allIds().filter(id=>(S.low[id]||S.out[id])&&!bk[id]&&!inl.has(id));
  let t='買い物リスト（'+(a.getTime()===b.getTime()?md(a):md(a)+'〜'+md(b))+'の分）\n';
  if(lows.length)t+='\n【切らした物・残り少ない物】\n'+lows.map(id=>'・'+ING[id][0]).join('\n')+'\n';
  CATS.forEach(cat=>{
    const rows=list.filter(e=>!e.done&&ING[e.id][1]===cat);if(!rows.length)return;
    t+='\n【'+cat+'】\n'+rows.map(e=>'・'+ING[e.id][0]+'　'+e.qty).join('\n')+'\n';
  });
  return t;
}
function sendList(el,off){
  const t=shopText(off),say=m=>{el.textContent=m;};
  if(navigator.share){navigator.share({text:t}).catch(()=>{});return;}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>say('写しました。メッセージに貼り付けてください'),()=>say('写せませんでした'));return;}
  say('この端末では送れません');
}
function renderShop(){
  const off=S.off,list=shopList(off),a=dayDate(off,firstDay(off)),b=dayDate(off,lastDay(off)),sp=S.span||0;
  let h=head('買い物',a.getTime()===b.getTime()?`<b>${md(a)}</b>の分`:`<b>${md(a)}</b>〜${md(b)}の分`);
  h+=`<section class="cond">${weekSwitch()}<div class="crow"><span class="clabel">何日分</span><div class="opts">${opt('1日分',sp===1,'span:1')}${opt('3日分',sp===3,'span:3')}${opt('残り全部',sp===0,'span:0')}</div></div></section>`;
  if(!list){h+=`<div class="empty">先に一週間の献立を作ってください。</div><button class="go wide" data-act="go:week">献立の画面へ</button>`;app.innerHTML=h;return;}
  const bk=S.bought[key(weekStart(off))]||{},inl=new Set(list.map(e=>e.id)),lows=allIds().filter(id=>!inl.has(id)&&(S.low[id]||S.out[id]||bk[id]==='low'||bk[id]==='out'));
  if(!list.length&&!lows.length){h+=`<div class="empty">買う物はありません。<br>家にある物で足ります。</div>`;app.innerHTML=h;return;}
  const left=list.filter(e=>!e.done).length+lows.filter(id=>!bk[id]).length;
  h+=`<p class="lead">2人分の量です。押すと「買った」になり、冷蔵庫にも「ある」が付きます。<b class="left">あと${left}品</b></p>`;
  if(left)h+=`<button class="more wide" data-act="send" style="margin-bottom:14px">この買い物リストを家族に送る</button>`;
  if(lows.length)h+=`<div class="cat"><h2><span>切らした物・残り少ない物</span><small>${lows.length}品</small></h2>`+lows.map(id=>`<button class="buyrow${bk[id]?' done':''}" data-act="buy:${id}"><span class="bx"></span><span class="n">${esc(ING[id][0])}</span><span class="q"></span><span class="w">在庫帳</span></button>`).join('')+'</div>';
  CATS.forEach(cat=>{
    const rows=list.filter(e=>ING[e.id][1]===cat);if(!rows.length)return;
    h+=`<div class="cat"><h2><span>${cat}</span><small>${rows.length}品</small></h2>`;
    rows.forEach(e=>{
      h+=`<button class="buyrow${e.done?' done':''}" data-act="buy:${e.id}"><span class="bx"></span><span class="n">${ING[e.id][0]}</span><span class="q">${e.qty}</span><span class="w">${e.days.join('・')}</span></button>`;
    });
    h+='</div>';
  });
  app.innerHTML=h;
}
function render(){
  document.querySelectorAll('nav button[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  ({week:renderWeek,today:renderToday,shop:renderShop,fridge:renderFridge})[S.tab]();
}
function showDay(i){
  const off=S.off,days=wk(off),d=days[i],dt=dayDate(off,i),from=firstDay(off);
  const others=days.map((x,j)=>j).filter(j=>j!==i&&j>=from);
  $('#sheet').innerHTML=`<div class="sheet" data-act="close"><div class="box">
   <div class="k">${md(dt)}</div>
   <h2>${WD[dt.getDay()]}曜日を変える</h2>
   <div class="rows">
   ${off===0&&i===todayIdx()?`<button class="srow" data-act="logs:${i}">食べた物を記録する<small>${logOf(0,i)?'いまの記録は「'+LOGK[logOf(0,i).k]+'」':'作った・別の物・外食'}</small></button>`:''}
   ${d.mode==='skip'?`<button class="srow" data-act="skip:${i}">作る日に戻す</button>`:`
    <button class="srow" data-act="re:${i}">別の献立に変える</button>
    <button class="srow" data-act="tired:${i}">${d.mode==='tired'?'ふつうの献立に戻す':'疲れた日の献立にする<small>短時間・手間の少ない物</small>'}</button>
    <button class="srow" data-act="skip:${i}">作らない日にする<small>外食・惣菜の日</small></button>`}
   </div>
   <div class="k" style="margin-top:18px">ほかの日と入れ替える</div>
   <div class="opts" style="margin:6px 0 20px">${others.map(j=>opt(WD[(S.shop+j)%7],false,`swap:${i}:${j}`)).join('')}</div>
   <button class="go wide" data-act="close">とじる</button>
  </div></div>`;
}

// ===== 操作 =====
document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){S.tab=tab.dataset.tab;S.sel=null;S.q='';save();render();window.scrollTo(0,0);return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  const [a,v,v2]=el.dataset.act.split(':');
  const shut=()=>{$('#sheet').innerHTML='';};
  if(a==='close'){if(e.target===el)shut();return;}
  const lg=logAct(a,v,v2);if(lg===false)return;if(lg===true){save();render();return;}
  const fr=fridgeAct(a,v,v2);if(fr===false)return;if(fr===true){save();render();return;}
  const off=S.tab==='today'?(S.sel?S.sel.off:0):S.off,days=wk(off),i=+v;
  if(a==='off'){S.off=i;}
  else if(a==='shop'){S.shop=i;}
  else if(a==='span'){S.span=i;}
  else if(a==='go'){S.tab=v;S.sel=null;window.scrollTo(0,0);}
  else if(a==='make'){
    if(days&&!confirm('いまの献立を消して、作り直しますか？'))return;
    makeWeek(off);if(S.tab==='today'){S.tab='week';S.off=0;}
  }
  else if(a==='send'){sendList(el,off);return;}
  else if(a==='day'){showDay(i);return;}
  else if(a==='view'){S.sel={off:S.off,i};S.tab='today';window.scrollTo(0,0);}
  else if(a==='re'){const d=days[i];if(d.mode==='past')d.mode='cook';d.c=pickDay(days,i,d.mode,d.c&&d.c[0]);shut();}
  else if(a==='tired'){const d=days[i];d.mode=d.mode==='tired'?'cook':'tired';d.c=pickDay(days,i,d.mode,d.c&&d.c[0]);shut();}
  else if(a==='skip'){const d=days[i];if(d.mode==='skip'){d.mode='cook';d.c=pickDay(days,i,'cook');}else{d.mode='skip';d.c=null;}shut();}
  else if(a==='swap'){const j=+v2,t=days[i];days[i]=days[j];days[j]=t;shut();}
  else if(a==='buy'){
    const k=key(weekStart(off)),b=S.bought[k]||(S.bought[k]={});
    if(b[v]){if(b[v]==='low')S.low[v]=true;else{delete S.stock[v];if(b[v]==='out')S.out[v]=true;}delete b[v];}
    else{b[v]=S.out[v]?'out':S.low[v]?'low':true;S.stock[v]=true;delete S.low[v];delete S.out[v];S.seen[v]=Date.now();}
  }
  save();render();
});
load();init2();render();
</script>
